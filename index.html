<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청년주택 공고 요약</title>
<style>
:root { --bg:#f7f8fa; --card:#fff; --tx:#1a1d21; --sub:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) { --bg:#0f1115; --card:#181b20; --tx:#e8eaed; --sub:#9aa0a6; --line:#2a2e35; --accent:#60a5fa; }
}
:root[data-theme="dark"] { --bg:#0f1115; --card:#181b20; --tx:#e8eaed; --sub:#9aa0a6; --line:#2a2e35; --accent:#60a5fa; }
* { box-sizing:border-box; }
body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--tx);
font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
line-height:1.6; }
.wrap { max-width:680px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 4px; letter-spacing:-0.02em; }
.sub { color:var(--sub); font-size:13px; margin:0 0 24px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px;
padding:20px; }
.badge { display:inline-block; font-size:12px; padding:3px 9px; border-radius:999px;
background:var(--accent); color:#fff; margin-bottom:12px; }
p { margin:0 0 10px; font-size:14px; }
.muted { color:var(--sub); font-size:13px; }
code { background:var(--bg); border:1px solid var(--line); border-radius:5px;
padding:1px 5px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
<h1>청년주택 공고 요약</h1>
<p class="sub">서울시 청년안심주택 · SH · LH 공고를 매일 모아 정리합니다</p>
<div class="card">
<span class="badge">준비 중</span>
<p>아직 첫 번째 수집이 실행되지 않았습니다.</p>
<p class="muted">자동화가 시작되면 매일 오전 10시에 이 페이지가 갱신되고,
요약이 카카오톡으로 발송됩니다.</p>
</div>
</div>
</body>
</html>
